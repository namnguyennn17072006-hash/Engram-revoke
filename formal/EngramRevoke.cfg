\* TLC configuration for EngramRevoke.tla
\* Chạy: tlc EngramRevoke  (hoặc java -jar tla2tools.jar EngramRevoke)

SPECIFICATION Spec

\* Biên trạng thái - giữ nhỏ để TLC duyệt exhaustive trong vài giây
CONSTANTS
  MaxEpoch = 5
  FreshnessWindow = 2

\* Invariants an toàn I1..I5 + bổ trợ
INVARIANTS
  TypeOK
  I1TerminalStable
  I2EpochMonotonic
  I3StaleRejected
  I4FailClosed
  I5NoLeak
  RevokeLatched

\* Ghi toàn bộ trạng thái vi phạm nếu có (counterexample trace)
\* TLC tự động in ra vòng lặp/đường đi dẫn tới trạng thái bad.
